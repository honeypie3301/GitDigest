[package]
name = "gitdigest"
version = "1.0.1"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
fancy-regex = "0.16"
flate2 = "1"
getrandom = "0.3"
icu_collator = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "sync", "net"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
strip = true

[[bin]]
name = "gitdigest"
path = "src/main.rs"
